[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agritwin-cps"
version = "0.1.0"
description = "Simulation-Based Greenhouse Digital Twin and Cyber-Physical Systems Research Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pydantic>=2.8", "matplotlib>=3.9", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
ui = ["streamlit>=1.40"]

[project.scripts]
agritwin = "agritwin_cps.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
